  }

  .page {

  .page-header {

    background: #2a2a2a;

    border-radius: 6px;
    color: #e8e8e8;

    padding: 7px 14px;

    display: flex;
    align-items: center;
    gap: 6px;
  }
  .new-btn:hover { background: #333; }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  .search-bar { position: relative; flex: 1; }
  .search-bar input {
    width: 100%;
    background: #2a2a2a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    color: #e8e8e8;
    font-size: 14px;
    padding: 8px 12px 8px 34px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-bar input:focus { border-color: rgba(255,255,255,0.2); }
  .search-bar input::placeholder { color: rgba(255,255,255,0.3); }
  .search-icon {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.3); font-size: 14px; pointer-events: none;
  }

  select {
    background: #2a2a2a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    color: #e8e8e8;
    font-size: 13px;
    padding: 7px 10px;
    outline: none;

  .status-bar {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 16px;
    height: 16px;
  }

  .box-group { margin-bottom: 4px; }

  .box-header {

  .chevron {

    font-weight: 500;

  .box-body.collapsed { display: none; }

  table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }

  th:nth-child(3) { width: 6%; }

</div>

let allItems = [];
let collapsedBoxes = new Set();

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

async function loadItems() {
  const { data, error } = await sb.from("inventory_items").select("*").order("box").order("name");
  if (error) { console.error("Load error:", error); setStatus("Error: " + error.message); return; }

  if ((data || []).length === 0) {
    setStatus("Seeding initial data…");
    const chunkSize = 25;
    for (let i = 0; i < SEED.length; i += chunkSize) {
      const { error: seedErr } = await sb.from("inventory_items").insert(SEED.slice(i, i + chunkSize));
      if (seedErr) { console.error("Seed error:", seedErr); setStatus("Seed error: " + seedErr.message); return; }
    }
    const { data: seeded } = await sb.from("inventory_items").select("*").order("box").order("name");
    allItems = seeded || [];
  } else {
    allItems = data;
  }

  populateBoxFilter();
  render();
  setStatus("");
}

function populateBoxFilter() {
  const sel = document.getElementById("filter-box");
  sel.innerHTML = '<option value="">All boxes</option>';
  BOXES.forEach(b => {
    const o = document.createElement("option");
    o.value = b; o.textContent = b;
    sel.appendChild(o);
  });

  const mSel = document.getElementById("m-box");
  mSel.innerHTML = "";
  BOXES.forEach(b => {
    const o = document.createElement("option");
    o.value = b; o.textContent = b;
    mSel.appendChild(o);
  });
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filterBox = document.getElementById("filter-box").value;
  const container = document.getElementById("inventory");
  const noResults = document.getElementById("no-results");
  container.innerHTML = "";

  const grouped = {};
  BOXES.forEach(b => grouped[b] = []);

  allItems.forEach(item => {
    if (!grouped[item.box]) grouped[item.box] = [];
    if (filterBox && item.box !== filterBox) return;
    if (q && !item.name.toLowerCase().includes(q) && !(item.note||"").toLowerCase().includes(q)) return;
    grouped[item.box].push(item);
  });

  let totalVisible = 0;

  BOXES.forEach((box, gi) => {
    const items = grouped[box] || [];
    if (filterBox && box !== filterBox) return;
    if (q && items.length === 0) return;
    totalVisible += items.length;

    const groupEl = document.createElement("div");
    groupEl.className = "box-group";

    const isCollapsed = collapsedBoxes.has(box);

    const header = document.createElement("div");
    header.className = "box-header";
    header.innerHTML = `
      <span class="chevron ${isCollapsed ? "collapsed" : ""}" id="chev-${gi}">▼</span>
      <span class="box-badge">${esc(box)}</span>
      <span class="box-count">${items.length}</span>
    `;

    const body = document.createElement("div");
    body.className = "box-body" + (isCollapsed ? " collapsed" : "");
    body.id = `body-${gi}`;

    const table = document.createElement("table");
    table.innerHTML = `<thead><tr><th>Item Name</th><th>Notes</th><th></th><th></th></tr></thead><tbody></tbody>`;
    const tbody = table.querySelector("tbody");

    items.forEach(item => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><span class="item-name"><span class="item-icon">📄</span>${esc(item.name)}</span></td>
        <td><span class="item-note">${esc(item.note || "")}</span></td>
        <td><button class="edit-btn" title="Edit item">✏️</button></td>
        <td><button class="del-btn" title="Remove item">×</button></td>
      `;
      tr.querySelector(".edit-btn").addEventListener("click", () => openModal(item));
      tr.querySelector(".del-btn").addEventListener("click", () => deleteItem(item.id, item.name));
      tbody.appendChild(tr);
    });

    body.appendChild(table);
    groupEl.appendChild(header);
    groupEl.appendChild(body);
    container.appendChild(groupEl);

    header.addEventListener("click", () => {
      if (collapsedBoxes.has(box)) collapsedBoxes.delete(box);
      else collapsedBoxes.add(box);
      render();
    });
  });

  noResults.style.display = (totalVisible === 0 && q) ? "block" : "none";
}

async function deleteItem(id, name) {
  if (!confirm(`Remove "${name}"?`)) return;
  setStatus("Removing…");
  const { error } = await sb.from("inventory_items").delete().eq("id", id);
  if (error) { setStatus("Error removing item."); return; }
  allItems = allItems.filter(i => i.id !== id);
  render();
  setStatus("");
}

let editingId = null;

function openModal(item = null) {
  editingId = item ? item.id : null;
  document.getElementById("m-name").value = item ? item.name : "";
  document.getElementById("m-note").value = item ? (item.note || "") : "";
  if (item) document.getElementById("m-box").value = item.box;
  document.querySelector(".modal h2").textContent = item ? "Edit item" : "Add item";
  document.getElementById("m-save").textContent = item ? "Save changes" : "Add item";
  document.getElementById("modal").classList.add("open");
  document.getElementById("m-name").focus();
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  editingId = null;
}

async function saveItem() {
  const name = document.getElementById("m-name").value.trim();
  const box = document.getElementById("m-box").value;
  const note = document.getElementById("m-note").value.trim();
  if (!name) { document.getElementById("m-name").focus(); return; }

  const btn = document.getElementById("m-save");
  btn.disabled = true;
  btn.textContent = editingId ? "Saving…" : "Adding…";

  if (editingId) {
    const { data, error } = await sb.from("inventory_items").update({ name, box, note }).eq("id", editingId).select().single();
    btn.disabled = false;
    btn.textContent = "Save changes";
    if (error) { alert("Error saving changes."); return; }
    const idx = allItems.findIndex(i => i.id === editingId);
    if (idx !== -1) allItems[idx] = data;
  } else {
    const { data, error } = await sb.from("inventory_items").insert({ name, box, note }).select().single();
    btn.disabled = false;
    btn.textContent = "Add item";
    if (error) { alert("Error adding item."); return; }
    allItems.push(data);
  }

  allItems.sort((a, b) => a.box.localeCompare(b.box) || a.name.localeCompare(b.name));
  closeModal();
  render();
}

function esc(str) {
  return (str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

document.getElementById("modal").addEventListener("click", e => {
  if (e.target === document.getElementById("modal")) closeModal();
});
document.getElementById("m-name").addEventListener("keydown", e => {
  if (e.key === "Enter") saveItem();
  if (e.key === "Escape") closeModal();
});

document.getElementById("search").addEventListener("input", render);
document.getElementById("filter-box").addEventListener("change", render);

loadItems();
</script>
</body>
</html>
